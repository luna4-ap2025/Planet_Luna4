name: Luna4 Observatory

permissions:
  contents: write

on:
  schedule:
    - cron: "*/1 * * * *"
  workflow_dispatch:

jobs:
  update-observatory:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
     
      - name: Commit observatory state
        run: |
          git config user.name "luna4-observatory"
          git config user.email "observatory@luna4"
          git add scripts/observatory_state.json
          git commit -m "🔭 Update observatory state" || echo "No changes"
          git push

      - name: Install dependencies
        run: pip install requests  
