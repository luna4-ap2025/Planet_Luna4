name: Luna4 Observatory

permissions:
  contents: write

on:
  schedule:
    - cron: "*/1 * * * *"
  workflow_dispatch:

jobs:
  update-observatory:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
     
      - name: Commit observatory state
        run: |
          git config user.name "luna4-observatory"
          git config user.email "observatory@luna4"
          git add scripts/observatory_state.json
          git commit -m "🔭 Update observatory state" || echo "No changes"
          git push

      - name: Install dependencies
        run: pip install requests

      - name: Update Observatory
        env:
          DISCORD_OBSERVATORY_WEBHOOK: ${{ secrets.DISCORD_OBSERVATORY_WEBHOOK }}
          OBSERVATORY_MESSAGE_ID: ${{ secrets.OBSERVATORY_MESSAGE_ID }}
          LOGS_WEBHOOK: ${{ secrets.LOGS_WEBHOOK }}
        run: |
          python - <<'EOF'
          import sys
          sys.path.append("scripts")
          from luna4_discord_post import post_observatory, log_darkside

          phase = "🌑 New Moon"
          cycle = 42
          resources = ["Carbon"]

          post_observatory(phase, cycle, resources)
          log_darkside(f"Observatory cycle {cycle} posted successfully")
          EOF
