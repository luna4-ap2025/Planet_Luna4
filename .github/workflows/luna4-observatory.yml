name: Luna4 Observatory

on:
  schedule:
    - cron: "*/1 * * * *"  # every minute for testing
  workflow_dispatch:

jobs:
  observatory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - run: pip install requests
      - name: Post Observatory
        env:
          DISCORD_OBSERVATORY_WEBHOOK: ${{ secrets.DISCORD_OBSERVATORY_WEBHOOK }}
          LOGS_WEBHOOK: ${{ secrets.LOGS_WEBHOOK }}
        run: |
          import sys
          sys.path.append("scripts")
          from luna4_discord_post import post_observatory, log_darkside
          
          # Example data, replace with your real Luna4 logic
          phase = "🌑 New Moon"
          cycle = 42
          resources = ["Carbon"]
          post_observatory(phase, cycle, resources)
          log_darkside(f"Observatory cycle {cycle} posted successfully")
