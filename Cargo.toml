[package]
name = "luna4"
version = "2.0.0"
edition = "2021"

[lib]
name = "luna4"
path = "src/lib.rs"

[dependencies]
common-game = "3.0.0"
crossbeam-channel = "0.5"
log = "0.4"
thiserror = "2.0"
strum = { version = "0.26", features = ["derive"] }
enum-as-inner = "0.6"

[dev-dependencies]
tempfile = "3.4"

[profile.release]
lto = true
codegen-units = 1